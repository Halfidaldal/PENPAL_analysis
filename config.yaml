# PENPAL Analysis Configuration

# Active experiment: "human-ai", "human-human", or "ai-ai"
active_experiment: "ai-ai"

# Experiment-specific configuration
experiments:
  human-ai:
    # Data paths
    raw_dir: "data/human-ai/raw"
    interim_dir: "data/human-ai/interim"
    processed_dir: "data/human-ai/processed"
    
    # Firestore settings (flat collection structure)
    firestore:
      collection_name: "story_data_TEXT"
      stories_collection: "stories_TEXT"
      min_interactions: 9
      schema: "flat"  # flat collection with all interactions
    
    # Cleaning parameters
    cleaning:
      max_turns: 10
    
    # Author columns in raw data (before normalization)
    raw_columns:
      author_1: "user"
      author_2: "ai"

  human-human:
    # Data paths
    raw_dir: "data/human-human/raw"
    interim_dir: "data/human-human/interim"
    processed_dir: "data/human-human/processed"
    
    # Firestore settings (nested collection structure)
    firestore:
      collection_name: "sessions_TEXT"
      stories_collection: "sessions_TEXT"
      min_interactions: 7
      schema: "nested"  # sessions with nested turns subcollection
    
    # Cleaning parameters
    cleaning:
      max_turns: 11
    
    # Author columns in raw data (before normalization)
    raw_columns:
      author_1: "user"
      author_2: "user2"

  ai-ai:
    # Data paths
    raw_dir: "data/ai-ai/raw"
    interim_dir: "data/ai-ai/interim"
    processed_dir: "data/ai-ai/processed"
    
    # No Firestore for ai-ai (simulated data)
    firestore: null
    
    # Cleaning parameters (same as human-ai)
    cleaning:
      max_turns: 10
    
    # Author columns (simulated uses agent_1/agent_2 for clarity)
    raw_columns:
      author_1: "agent_1"
      author_2: "agent_2"
    
    # Simulation configuration (matches actual experiment parameters)
    simulation:
      n_stories_per_model: 10
      n_turns_per_story: 10
      temperature: 1.0       # Matches LLM_HYPERPARAMS.TEMPERATURE from experiment
      max_tokens: 35         # Matches LLM_HYPERPARAMS.MAX_TOKENS from experiment
      models:
      #do not change these!
        - id: "gpt-4.1-2025-04-14"
          provider: "openai"
          model_name: "gpt-4.1-2025-04-14"
          env_key: "OPENAI_API_KEY"
          
        - id: "claude-sonnet-4-5-20250929"
          provider: "anthropic"
          model_name: "claude-sonnet-4-5-20250929"
          base_url: "https://api.anthropic.com/v1/"
          env_key: "ANTHROPIC_API_KEY"
        # HuggingFace Inference (OpenAI-compatible, matching original experiment setup)
        - id: "llama-70b"
          provider: "huggingface"
          model_name: "meta-llama/Llama-3.3-70B-Instruct"
          base_url: "https://router.huggingface.co/v1"
          env_key: "OPENROUTER_API_KEY"
        - id: "qwen-72b"
          provider: "huggingface"
          model_name: "Qwen/Qwen2.5-72B-Instruct"
          base_url: "https://router.huggingface.co/v1"
          env_key: "OPENROUTER_API_KEY"

# Shared configuration (applies to all experiments)
shared:
  # Firestore credentials
  firestore:
    credentials_path: "environment/the-never-ending-story-a7b5f-0f4f8dbe4084.json"
  
  # Cleaning parameters
  cleaning:
    # Legacy edit-distance settings are intentionally no longer used by
    # scripts/02_clean_dataset.py. The primary pipeline uses deterministic
    # text-quality QC without rewriting participant text.
    edit_distance_threshold: 100
    text_quality_qc:
      story_exclusion_min_flagged_rows: 2
      exclude_if_first_human_flagged: true
      min_substantive_chars: 3
      min_alpha_ratio: 0.45
      max_symbol_ratio: 0.35
      max_keyboard_pattern_ratio: 0.12
      min_word_vowel_ratio: 0.35
      long_token_chars: 24
      min_word_count_for_vowel_check: 3
    simulated: false
  
  # Embedding models
  embeddings:
    model_name: "Kingsoft-LLM/QZhou-Embedding"
    batch_size: 1
    task: null
  
  # Novelty computation
  novelty:
    model_name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    window_size: 40
    task: null
    hf_token: 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
  
  # Semantic exploration
  exploration:
    max_k: 10
  
  # Sentiment analysis
  sentiment:
    model_name: "cardiffnlp/twitter-roberta-base-sentiment-latest"
    batch_size: 64
    valence_method: "simple"  # "simple", "amplify", or "dampen"
    engine: "projection"      # "bert" or "projection"
    language: "en"
    axis: "valence"           # Semantic Projection axis name
  
  # Simulation parameters (AI-AI baseline)
  simulation:
    n_turns_per_story: 10
    model_name: "gpt-4o-mini"
    seed: 42
  
  # Surface metrics (textdescriptives)
  surface_metrics:
    spacy_mdl: "en_core_web_md"
    batch_size: 10
    n_process: 5
  
  # Analysis parameters
  analysis:
    random_seed: 42
    language: "en"

# Legacy Berlin configuration (kept for reference, not actively maintained)
legacy:
  Berlin:
    raw_dir: "data/Berlin/raw"
    interim_dir: "data/Berlin/interim"
    processed_dir: "data/Berlin/processed"
    firestore:
      collection_name: "story_data_berlin"
      min_interactions: 5
    cleaning:
      max_turns: 5
    embeddings:
      model_name: "jinaai/jina-embeddings-v3"
    sentiment:
      model_name: "ssary/XLM-RoBERTa-German-sentiment"
      language: "de"
