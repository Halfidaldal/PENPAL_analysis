# PENPAL Analysis Configuration

# Active dataset (change this to switch between datasets)
active_dataset: "TEXT"  # Options: "TEXT"

# Data paths per dataset
datasets:
  TEXT:
    raw_dir: "data/raw"
    interim_dir: "data/interim"
    processed_dir: "data/processed"
# Firestore settings
firestore:
  credentials_path: "environment/the-never-ending-story-a7b5f-0f4f8dbe4084.json"
  TEXT:
    collection_name: "sessions_TEXT"
    stories_collection: "sessions_TEXT"
    min_interactions: 10


# Cleaning parameters
cleaning:
  edit_distance_threshold: 100
  simulated: False      # whether to clean simulated or user dataset 
  TEXT:
    max_turns: 11        # maximum turns per story to keep during cleaning

# Embedding models
embeddings:
  TEXT:
    model_name: "Kingsoft-LLM/QZhou-Embedding"
    batch_size: 1
    task: null

novelty:
  model_name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  window_size: 40
  task: null
  hf_token: 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

exploration:
  max_k: 10

# Sentiment analysis
sentiment:
  TEXT:
    model_name: "cardiffnlp/twitter-roberta-base-sentiment-latest"
    batch_size: 64
    valence_method: "simple"  # "simple", "amplify", or "dampen"
    engine: 'projection'  # 'bert' or 'projection'
    language: 'en'

# Simulation parameters
simulation:
  TEXT:
    n_turns_per_story: 10
    model_name: "gpt-4o-mini"
    seed: 42
    # OpenAI API key: set via environment variable OPENAI_API_KEY or pass to script
    client_ids: ["1", "2"]  # Client IDs to simulate
    workshop_ids: ["1", "2", "3"]  # Workshop IDs to simulate
    n_simulations: 2

# textdescriptives (skud ud Lasse)
surface_metrics: 
  spacy_mdl: "en_core_web_md" 
  batch_size: 10
  n_process: 5


# Analysis parameters
analysis:
  random_seed: 42
  languages:
    - "en"
